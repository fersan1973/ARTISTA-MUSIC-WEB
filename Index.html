<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTISTA MUSIC | Record Label & Artist Development</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(22, 22, 27, 0.72);
      --card-border: rgba(212, 175, 55, 0.22);
      --gold-primary: #d4af37;
      --gold-light: #f7e089;
      --gold-dark: #aa8210;
      --silver: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-neon: #ffaa00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(255, 170, 0, 0.05) 0%, transparent 45%),
        linear-gradient(180deg, #050507 0%, #0c0d12 100%);
      background-attachment: fixed;
    }

    /* NAVIGATION */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(9, 9, 11, 0.85);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 7%;
    }

    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ffffff 15%, var(--gold-light) 50%, var(--gold-primary) 85%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      text-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--silver);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--gold-light);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    }

    /* HERO SECTION */
    .hero {
      position: relative;
      padding: 7rem 7% 4rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .badge-label {
      display: inline-block;
      padding: 0.4rem 1.4rem;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold-light);
      font-size: 0.75rem;
      letter-spacing: 2px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
    }

    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 20%, #d4af37 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 950px;
      margin-bottom: 1.5rem;
    }

    .hero-sub {
      color: var(--text-muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      max-width: 700px;
      margin-bottom: 2.8rem;
      font-weight: 300;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      justify-content: center;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
      color: #0b0c10;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.85rem;
      padding: 0.95rem 2.2rem;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.55);
    }

    .btn-outline {
      background: transparent;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.85rem;
      padding: 0.95rem 2.2rem;
      border-radius: 6px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: border-color 0.3s ease, background-color 0.3s ease;
    }

    .btn-outline:hover {
      border-color: var(--gold-light);
      background: rgba(212, 175, 55, 0.08);
    }

    /* SECTION CONTAINERS */
    section {
      padding: 5rem 7%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 0.6rem;
    }

    .section-title span {
      color: var(--gold-primary);
    }

    .section-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* AUDIO SYNTH PLAYER */
    .synth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2.2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      max-width: 900px;
      margin: 0 auto 5rem;
    }

    .player-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .track-meta h4 {
      font-size: 1.25rem;
      color: var(--gold-light);
      font-weight: 700;
    }

    .track-meta p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .synth-buttons {
      display: flex;
      gap: 0.75rem;
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.65rem 1.1rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sound-btn:hover {
      background: var(--gold-primary);
      color: #000;
      border-color: var(--gold-light);
    }

    #visualizer {
      width: 100%;
      height: 90px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: block;
    }

    /* ROSTER GRID */
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .roster-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease;
      position: relative;
    }

    .roster-card:hover {
      transform: translateY(-6px);
      border-color: var(--gold-primary);
    }

    .roster-img-wrap {
      width: 100%;
      height: 240px;
      background: linear-gradient(135deg, #1f2029 0%, #111218 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--card-border);
      position: relative;
    }

    .roster-placeholder-text {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: rgba(212, 175, 55, 0.35);
      text-transform: uppercase;
    }

    .roster-details {
      padding: 1.5rem;
    }

    .roster-genre {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .roster-name {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .roster-stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .roster-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 0.65rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .roster-btn:hover {
      background: var(--gold-primary);
      color: #000;
    }

    /* TOUR TABLE */
    .tour-filter-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--silver);
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--gold-primary);
      color: #000;
      border-color: var(--gold-primary);
      font-weight: 600;
    }

    .tour-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
    }

    .tour-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .tour-table th, .tour-table td {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tour-table th {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-light);
      background: rgba(0, 0, 0, 0.25);
    }

    .tour-date {
      font-weight: 700;
      color: #ffffff;
      font-size: 0.95rem;
    }

    .tour-venue {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* DEMO SUBMISSION FORM */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2.8rem;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group.full {
      grid-column: span 2;
    }

    .form-group label {
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-light);
      font-weight: 600;
    }

    .form-control {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--gold-primary);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--card-border);
      padding: 3.5rem 7%;
      text-align: center;
      background: rgba(5, 5, 7, 0.95);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .footer-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: var(--gold-primary);
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: span 1; }
      .tour-table th, .tour-table td { padding: 0.9rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="#" class="brand-logo">ARTISTA MUSIC</a>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#roster">Artists</a></li>
      <li><a href="#tour">Live Dates</a></li>
      <li><a href="#demo">Submit Demo</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <header class="hero">
    <div class="badge-label">Premier Record Label &amp; Talent Acquisition</div>
    <h1 class="hero-title
